[project]
name = "research-agents"
version = "0.1.0"
description = "Multi-agent research with durable state, budgets enforced in the graph, provenance and step tracing"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["research"]
